name: CI

on:
  push:
    branches: [ "demo" ]
  pull_request:
    branches: [ "demo" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: pip3 install databricks-cli

      - name: Debug Databricks Secrets (Partial Echo)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Databricks Host: ${DATABRICKS_HOST}"
          echo "Databricks Token (first 5 chars): ${DATABRICKS_TOKEN:0:5}*****"

      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          mkdir -p ~/.databricks
          cat <<EOF > ~/.databricks/config
          [DEFAULT]
          host = $DATABRICKS_HOST
          token = $DATABRICKS_TOKEN
          EOF

      - name: Verify Databricks CLI login
        run: databricks workspace list
