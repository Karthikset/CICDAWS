name: CI

on:
  push:
    branches: [ "demo" ]
  pull_request:
    branches: [ "demo" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: pip3 install databricks-cli

      - name: Configure Databricks CLI
        run: |
          mkdir -p ~/.databricks
          cat <<EOF > ~/.databricks/config
          [DEFAULT]
          host = ${{ secrets.DATABRICKS_HOST }}
          token = ${{ secrets.DATABRICKS_TOKEN }}
          EOF

      # ⚠️ Optional: Echoing secrets can expose sensitive info. Use only for debugging.
      - name: Echo Databricks Host URL (Debug Only)
        run: echo "Databricks Host is set to $DATABRICKS_HOST"
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}

      # ✅ Uncomment this step if you want to verify CLI login
      # - name: Verify Databricks CLI login
      #   run: databricks workspace list /Users/kennnethcarlson@gmail.com

      - name: Run Databricks Notebook
        uses: databricks/run-notebook@v0.0.3
        with:
          workspace-notebook-path: "/Workspace/Users/kennnethcarlson@gmail.com/sample"
          databricks-host: ${{ secrets.DATABRICKS_HOST }}
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}
          new-cluster-json: '{
            "num_workers": 1,
            "spark_version": "10.4.x-scala2.12",
            "node_type_id": "Standard_D3_v2"
          }'
          run-name: "CI Notebook Run"
