name: Deploy to Databricks

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Databricks CLI
        run: |
          pip install databricks-cli

      - name: Configure Databricks CLI
        run: |
          mkdir -p ~/.databricks
          echo "[DEFAULT]" > ~/.databricks/config
          echo "host = $DATABRICKS_HOST" >> ~/.databricks/config
          echo "token = $DATABRICKS_TOKEN" >> ~/.databricks/config

      - name: List workspace contents
        run: |
          echo "Listing workspace files..."
          databricks workspace list /

      - name: Run notebook on serverless compute
        uses: databricks/run-notebook@v0.0.3
        with:
          databricks-host: ${{ secrets.DATABRICKS_HOST }}
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}
          workspace-notebook-path: /Workspace/Users/kennnethcarlson@gmail.com/sample
          run-name: CI Notebook Run
          workspace-temp-dir: /tmp/databricks-github-actions
          git-provider: gitHub
          # Uncomment and customize if you want to pass parameters to the notebook
          # notebook-params-json: '{ "param1": "value1", "param2": "value2" }'
