name: Setup Databricks CLI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  setup-databricks:
    runs-on: [self-hosted, windows]  # Target Windows self-hosted runner

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Python & pip (if not pre-installed)
      run: |
            winget install Databricks.DatabricksCLI
            #choco install python3 -y
      shell: powershell

    - name: Install Databricks CLI
      run: |
        pip install databricks-cli
      shell: powershell

    - name: Configure Databricks CLI
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        $configPath = "$env:USERPROFILE\.databricks\config"
        New-Item -ItemType Directory -Force -Path (Split-Path $configPath)
        @"
        [DEFAULT]
        host = $env:DATABRICKS_HOST
        token = $env:DATABRICKS_TOKEN
        "@ | Out-File -FilePath $configPath -Encoding utf8
      shell: powershell

    - name: Test Databricks CLI login
      run: |
        databricks workspace list
      shell: powershell
